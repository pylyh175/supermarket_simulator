<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supermarket Simulator</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="webgl-fallback" hidden>
      <p><strong>WebGL isn't available in this browser.</strong></p>
      <p>Supermarket Simulator needs WebGL to draw its 3D store. Please try a recent version of Chrome, Edge, Firefox, or Safari — or enable hardware acceleration / WebGL in your browser settings — and reload this page.</p>
    </div>
    <div id="money-hud" aria-live="polite">Money: RM0.00</div>
    <div id="lock-hint" role="status" hidden>Click the canvas to look around</div>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="item-tooltip" hidden aria-hidden="true"><div class="tip-title"></div><div class="tip-price"></div></div>
    <script type="module" src="/src/three/main.ts"></script>
  </body>
</html>
